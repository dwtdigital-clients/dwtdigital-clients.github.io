name: keep-supabase-alive

# But : empecher la mise en pause du projet Supabase (free tier -> pause apres 7j d'inactivite).
# Un ping quotidien maintient le projet eveille.
# Detection de panne : si le projet est en pause, le host Supabase ne resout plus (echec DNS)
# -> curl echoue -> ce job echoue -> GitHub envoie un e-mail auto = alerte gratuite.
# Aucune cle n'est necessaire : on ne lit pas de donnees, on verifie juste que le serveur repond.

on:
  schedule:
    - cron: '17 5 * * *'   # tous les jours ~05:17 UTC
  workflow_dispatch: {}     # permet un lancement manuel depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: "https://hamhhnulwmqpixazffoc.supabase.co"
        run: |
          set -uo pipefail
          echo "Ping $SUPABASE_URL/rest/v1/ ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SUPABASE_URL/rest/v1/" || echo "000")
          echo "Reponse HTTP: $code"
          # 000 = pas de reponse (host injoignable / projet en pause). Tout autre code = serveur vivant.
          if [ "$code" = "000" ]; then
            echo "::error::Supabase injoignable - projet possiblement EN PAUSE ou down."
            exit 1
          fi
          echo "OK - Supabase repond (HTTP $code), projet eveille."
