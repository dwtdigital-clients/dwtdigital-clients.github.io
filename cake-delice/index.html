<style>
/* ====== CHARTE CAKE DÉLICE — modifier ici ====== */
:root {
  --p: #C25B6E;          /* vieux rose — principale (grands textes, filets, script) */
  --s: #F6DCDA;          /* rose poudré — secondaire (panneaux, fonds) */
  --accent: #8E2C48;     /* framboise — boutons, liens, prix */
  --accent-hover: #7A2440;
  --bg: #FBF6EF;         /* ivoire — fond de page */
  --text: #2B1E1F;       /* chocolat */
  --text-muted: #6E5A58; /* cacao */
  --card: #F1E6DA;       /* crème */
  --line: #E3D2C6;       /* lin */
  --font-title: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Jost', system-ui, sans-serif;
  --font-script: 'Pinyon Script', cursive;
  --radius-btn: 999px;
  --radius: 2px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --hero-split: 7fr 3fr;  /* 70/30 photo / panneau */
}

*,*::before,*::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: var(--accent); }
a:hover { color: var(--p); }
::selection { background: var(--s); }
a:focus-visible, .btn:focus-visible, .fleche:focus-visible, .burger:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Labels capitales */
.label { font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; }

/* Boutons */
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 28px; border-radius: var(--radius-btn); font: 500 12px/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: background .4s var(--ease), color .4s var(--ease); }
.btn--plein { background: var(--accent); color: var(--bg); border: 0; }
.btn--plein:hover { background: var(--accent-hover); color: var(--bg); }
.btn--contour { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn--contour:hover { background: var(--accent); color: var(--bg); }

/* ====== NAVIGATION ====== */
.nav { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px clamp(16px,3vw,40px); background: #fff; border-bottom: 1px solid var(--line); }
.nav__gauche { display: flex; align-items: center; gap: clamp(16px,3vw,40px); }
.nav__marque { font-family: var(--font-script); font-size: 36px; line-height: 1; color: var(--text); text-decoration: none; }
.nav__liens { display: flex; gap: clamp(14px,2.4vw,32px); list-style: none; margin: 0; padding: 0; }
.nav__liens a { color: var(--accent); text-decoration: none; }
.nav__liens a:hover { color: var(--p); }
.nav__droite { display: flex; align-items: center; gap: 12px; }
/* Burger (mobile) */
.burger { display: none; flex-direction: column; gap: 5px; width: 46px; height: 46px; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; flex-shrink: 0; }
.burger span { display: block; width: 20px; height: 2px; background: var(--accent); border-radius: 2px; transition: transform .25s var(--ease), opacity .2s; }
.burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.menu-mobile { position: fixed; left: 0; right: 0; top: 0; z-index: 9; background: #fff; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; max-height: 0; transition: max-height .35s var(--ease); }
.menu-mobile.open { max-height: 360px; }
.menu-mobile a { padding: 16px clamp(16px,3vw,40px); color: var(--accent); text-decoration: none; border-top: 1px solid var(--line); font: 500 13px/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; }
.menu-mobile a:first-child { border-top: 0; }

/* ====== HERO 70/30 ====== */
.hero { display: grid; grid-template-columns: var(--hero-split); min-height: clamp(520px, calc(100vh - 81px), 820px); }
.hero__photo { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(24px,4vw,64px); background: var(--p); }
.hero__photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero__photo::after { content: ""; position: absolute; inset: auto 0 0 0; height: 60%; background: linear-gradient(to top, rgba(43,30,31,.45), rgba(43,30,31,0)); }
.hero__texte { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 6px; }
.hero__script { font-family: var(--font-script); font-size: clamp(30px,3.4vw,48px); line-height: 1; color: var(--s); }
.hero__titre { margin: 0; font-family: var(--font-title); font-weight: 300; font-size: clamp(56px,8.5vw,136px); line-height: .88; letter-spacing: -.02em; color: var(--bg); }
.hero__titre em { font-weight: 400; }

.hero__panneau { background: var(--s); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: clamp(32px,4vw,56px); text-align: center; }
.slide__entete { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.slide__cat { color: var(--text-muted); font-size: 11px; letter-spacing: .24em; }
.slide__nom { font-family: var(--font-title); font-size: clamp(28px,2.6vw,40px); line-height: 1.05; color: var(--accent); text-wrap: balance; }
.slide__photo { width: min(100%, 280px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: #EFC9C6; box-shadow: 0 40px 40px -36px rgba(142,44,72,.45); }
.slide__photo img { width: 100%; height: 100%; object-fit: cover; }
.slide__prix { font-family: var(--font-title); font-weight: 500; font-size: 22px; color: var(--accent); margin-top: -8px; }
.slide__anim { transition: opacity .5s var(--ease), transform .5s var(--ease); }
.slide__anim.is-out { opacity: 0; transform: translateY(8px); }

.fleches { display: flex; gap: 16px; align-items: center; }
.fleche { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .3s var(--ease); }
.fleche:hover { background: var(--bg); }
.compteur { font-family: var(--font-title); font-style: italic; font-size: 18px; color: var(--text-muted); min-width: 44px; }

/* Apparition au scroll */
.reveal { opacity: 0; transform: translateY(12px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.reveal.is-visible { opacity: 1; transform: none; }

@media (max-width: 860px) {
  .nav__liens { display: none; }
  .nav__marque { font-size: 30px; }
  .burger { display: flex; }
  .hero { grid-template-columns: 1fr; min-height: 0; }
  .hero__photo { min-height: 68vh; }
}
@media (min-width: 861px) {
  .burger, .menu-mobile { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  .reveal, .slide__anim, .menu-mobile { transition: none; opacity: 1; transform: none; }
}
</style>

<script>
/* ====== CRÉATIONS DU CARROUSEL — modifier ici ====== */
const CREATIONS = [
  { cat: 'Layer cake', nom: 'Couronne dorée',            prix: 'dès 20 €',     img: 'assets/photos/couronne-doree.jpg' },
  { cat: 'Bento cake', nom: 'Fleur de cerisier',         prix: '15 €',         img: 'assets/photos/bento-cerisier.jpg' },
  { cat: 'Layer cake', nom: 'Cœur rouge passion',        prix: 'dès 30 €',     img: 'assets/photos/coeur-rouge.jpg' },
  { cat: 'Cookies',    nom: 'Framboise & chocolat blanc', prix: 'sur commande', img: 'assets/photos/cookies-framboise.jpg' }
];

(function () {
  "use strict";
  var i = 0;
  var $ = function (s) { return document.querySelector(s); };
  var parts = document.querySelectorAll('[data-slide]');
  CREATIONS.forEach(function (c) { var im = new Image(); im.src = c.img; });

  function show(n) {
    i = (n + CREATIONS.length) % CREATIONS.length;
    var c = CREATIONS[i];
    parts.forEach(function (p) { p.classList.add('is-out'); });
    setTimeout(function () {
      $('[data-slide-cat]').textContent = c.cat;
      $('[data-slide-nom]').textContent = c.nom;
      $('[data-slide-prix]').textContent = c.prix;
      var img = $('[data-slide-img]'); img.src = c.img; img.alt = c.nom;
      $('[data-compteur]').textContent = (i + 1) + ' / ' + CREATIONS.length;
      parts.forEach(function (p) { p.classList.remove('is-out'); });
    }, 250);
  }
  $('[data-prev]').addEventListener('click', function () { show(i - 1); });
  $('[data-next]').addEventListener('click', function () { show(i + 1); });

  /* Menu burger mobile */
  var burger = document.getElementById('burger');
  var menu = document.getElementById('menu-mobile');
  var nav = document.querySelector('.nav');
  function placeMenu() { if (nav) menu.style.top = nav.offsetHeight + 'px'; }
  function closeMenu() { burger.setAttribute('aria-expanded', 'false'); menu.classList.remove('open'); }
  placeMenu();
  burger.addEventListener('click', function () {
    var open = burger.getAttribute('aria-expanded') === 'true';
    burger.setAttribute('aria-expanded', String(!open));
    placeMenu();
    menu.classList.toggle('open', !open);
  });
  menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  window.addEventListener('resize', function () { placeMenu(); if (window.innerWidth > 860) closeMenu(); });

  /* Apparition au scroll */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } });
    }, { threshold: .15 });
    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('is-visible'); });
  }
})();
</script>
