<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DWT — Statistiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0b0610; --bg2:#150a1e; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.10); --txt:#f3ecfa; --mut:#b49dc9; --vio:#7B1FA2; --vio2:#a94fd0;
    --lime:#7BC93A; --blue:#3fa9ff; --err:#ff6b8a;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#2d0636 0%,transparent 60%),linear-gradient(180deg,#0b0610,#120717);
    color:var(--txt);font-family:Poppins,system-ui,sans-serif;min-height:100vh;overflow-x:clip}
  h1,h2,.n{font-family:Syne,sans-serif}
  a{color:var(--vio2)}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 16px 70px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#7B1FA2,#4F0F5C);display:grid;place-items:center;font-family:Syne;font-weight:800;color:#fff;box-shadow:0 6px 20px rgba(123,31,162,.4)}
  h1{font-size:1.4rem;margin:0;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--mut);font-size:.82rem;margin-top:2px}
  .glass{background:var(--card);border:1px solid var(--line);border-radius:18px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .seg{display:inline-flex;gap:2px;padding:4px;border-radius:12px}
  .seg button{border:none;background:none;color:var(--mut);font-family:Poppins;font-weight:600;font-size:.82rem;
    padding:7px 14px;border-radius:9px;cursor:pointer;transition:.18s}
  .seg button.on{background:linear-gradient(145deg,var(--vio),#4F0F5C);color:#fff}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 18px}
  .kpi{padding:18px}
  .kpi .lab{color:var(--mut);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
  .kpi .val{font-family:Syne;font-weight:800;font-size:2rem;line-height:1.1;margin-top:6px}
  .kpi.v .val{color:#d6a7f5} .kpi.p .val{color:var(--blue)} .kpi.c .val{color:var(--lime)} .kpi.t .val{color:#fff}
  /* grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{padding:18px}
  .panel h2{font-size:.95rem;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--vio2)}
  /* bar chart jours */
  .chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px}
  .chart .bar{flex:1;background:linear-gradient(180deg,var(--vio2),var(--vio));border-radius:4px 4px 0 0;min-height:2px;position:relative;transition:.2s}
  .chart .bar:hover{filter:brightness(1.25)}
  .chart .bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--mut);white-space:nowrap;opacity:0;transition:.15s;background:#1a0f24;padding:2px 5px;border-radius:5px;pointer-events:none;margin-bottom:4px}
  .chart .bar:hover span{opacity:1}
  .xax{display:flex;justify-content:space-between;color:var(--mut);font-size:.66rem;margin-top:8px}
  /* listes */
  .rowlist{display:flex;flex-direction:column;gap:9px}
  .rl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:.85rem}
  .rl .track{grid-column:1/-1;height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:-4px}
  .rl .fill{height:100%;background:linear-gradient(90deg,var(--vio),var(--vio2));border-radius:4px}
  .rl .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rl .c{color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}
  .muted{color:var(--mut);font-size:.85rem}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:8px 12px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:.82rem}
  .chip b{font-family:Syne;color:#fff}
  /* login */
  .login{max-width:380px;margin:8vh auto 0;padding:26px}
  .login h2{font-size:1.15rem;margin:0 0 4px}
  .field{margin-top:14px}
  .field label{display:block;font-size:.78rem;color:var(--mut);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--txt);font-family:Poppins;font-size:.95rem}
  .btn{margin-top:18px;width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;font-family:Syne;font-weight:700;font-size:.95rem;
    background:linear-gradient(120deg,var(--vio) 0%,#4F0F5C 55%,var(--lime) 240%);color:#fff}
  .btn:disabled{opacity:.6}
  .note{margin-top:12px;font-size:.8rem;color:var(--err);min-height:1.1em}
  .foot{margin-top:26px;text-align:center;color:var(--mut);font-size:.76rem}
  .foot a{margin:0 8px}
  .hide{display:none!important}
  @media(max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== LOGIN ===== -->
  <section id="login" class="glass login hide">
    <div class="brand" style="margin-bottom:10px"><div class="logo">D</div><div><h1 style="font-size:1.1rem">Statistiques DWT</h1><div class="sub">Accès réservé</div></div></div>
    <form id="loginForm">
      <div class="field"><label>E-mail admin</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" id="loginBtn" type="submit">Se connecter</button>
      <div class="note" id="loginNote"></div>
    </form>
    <div class="foot"><a href="/dashboard.html">← Dashboard CEO</a></div>
  </section>

  <!-- ===== APP ===== -->
  <section id="app" class="hide">
    <header>
      <div class="brand"><div class="logo">D</div><div><h1>Statistiques du site</h1><div class="sub" id="periodLabel">30 derniers jours</div></div></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="seg glass" role="tablist">
          <button data-d="7">7 j</button>
          <button data-d="30" class="on">30 j</button>
          <button data-d="90">90 j</button>
        </div>
        <button class="seg glass" id="logout" style="padding:8px 6px"><span style="padding:2px 8px;color:var(--mut)">Déconnexion</span></button>
      </div>
    </header>

    <div class="kpis">
      <div class="kpi v glass"><div class="lab">Visiteurs</div><div class="val" id="kVis">–</div></div>
      <div class="kpi p glass"><div class="lab">Pages vues</div><div class="val" id="kPv">–</div></div>
      <div class="kpi c glass"><div class="lab">Conversions</div><div class="val" id="kConv">–</div></div>
      <div class="kpi t glass"><div class="lab">Événements</div><div class="val" id="kTot">–</div></div>
    </div>

    <div class="panel glass" style="margin-bottom:16px">
      <h2><span class="dot"></span>Visites par jour</h2>
      <div class="chart" id="chart"></div>
      <div class="xax" id="xax"></div>
    </div>

    <div class="grid">
      <div class="panel glass"><h2><span class="dot"></span>Sources de trafic</h2><div class="rowlist" id="sources"></div></div>
      <div class="panel glass"><h2><span class="dot"></span>Pages les plus vues</h2><div class="rowlist" id="pages"></div></div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div class="panel glass"><h2><span class="dot"></span>Conversions</h2><div class="chips" id="events"></div></div>
      <div class="panel glass"><h2><span class="dot"></span>Appareils</h2><div class="chips" id="devices"></div></div>
    </div>

    <div class="foot"><a href="/dashboard.html">Dashboard CEO</a> · <a href="/">Site</a></div>
  </section>

  <div id="boot" class="muted" style="text-align:center;margin-top:12vh">Chargement…</div>
</div>

<script>
(function(){
  "use strict";
  var SUPABASE_URL = 'https://hamhhnulwmqpixazffoc.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhbWhobnVsd21xcGl4YXpmZm9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzEzOTgsImV4cCI6MjA5NTY0NzM5OH0.bJfSJccRR6TXg-uDjf9Jo_vc9pdWX6NGWQwSCESkpHY';
  var WORKER_BASE = 'https://dwt-admin.darellwilliampro1.workers.dev';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  var days = 30;

  var $ = function(id){ return document.getElementById(id); };
  function show(el){ el.classList.remove('hide'); }
  function hide(el){ el.classList.add('hide'); }
  function fmt(n){ return (n==null?0:n).toLocaleString('fr-FR'); }

  async function token(){
    try{ var s = await sb.auth.getSession(); return s && s.data && s.data.session ? s.data.session.access_token : null; }catch(e){ return null; }
  }

  function showLogin(msg){ hide($('boot')); hide($('app')); show($('login')); if(msg) $('loginNote').textContent = msg; }
  function showApp(){ hide($('boot')); hide($('login')); show($('app')); }

  async function load(){
    var t = await token();
    if(!t){ showLogin(''); return; }
    var r;
    try{
      r = await fetch(WORKER_BASE + '/admin/stats?days=' + days, {
        method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + t }, body:'{}'
      });
    }catch(e){ showApp(); return; }
    if(r.status === 401){ showLogin('Accès refusé (compte non-admin) ou session expirée.'); return; }
    if(!r.ok){ showApp(); return; }
    var j = await r.json().catch(function(){ return null; });
    if(!j || !j.data){ showApp(); return; }
    showApp();
    render(j.data);
  }

  function render(d){
    $('kVis').textContent = fmt(d.visiteurs);
    $('kPv').textContent  = fmt(d.pageviews);
    $('kConv').textContent= fmt(d.conversions);
    $('kTot').textContent = fmt(d.total);
    $('periodLabel').textContent = d.days + ' derniers jours';

    // chart par jour (remplit tous les jours de la période, même à 0)
    var series = [];
    for(var i = d.days - 1; i >= 0; i--){
      var day = new Date(Date.now() - i*86400000).toISOString().slice(0,10);
      series.push({ day:day, n:(d.parJour && d.parJour[day]) ? d.parJour[day] : 0 });
    }
    var max = series.reduce(function(m,x){ return Math.max(m,x.n); }, 0) || 1;
    $('chart').innerHTML = series.map(function(x){
      var h = Math.round((x.n / max) * 100);
      var lab = x.day.slice(8,10) + '/' + x.day.slice(5,7);
      return '<div class="bar" style="height:'+Math.max(h,x.n>0?4:1)+'%"><span>'+lab+' · '+x.n+'</span></div>';
    }).join('');
    var first = series[0].day, last = series[series.length-1].day;
    $('xax').innerHTML = '<span>'+first.slice(8,10)+'/'+first.slice(5,7)+'</span><span>'+last.slice(8,10)+'/'+last.slice(5,7)+'</span>';

    rows('sources', d.topSources, 'Aucune source pour l\'instant.');
    rows('pages', d.topPages, 'Aucune page vue pour l\'instant.');
    chips('events', d.events, 'Aucune conversion encore. Un envoi de formulaire ou un clic « Audit » apparaîtra ici.');
    chips('devices', d.devices, 'Pas de données appareil.');
  }

  function rows(id, list, empty){
    var el = $(id);
    if(!list || !list.length){ el.innerHTML = '<div class="muted">'+empty+'</div>'; return; }
    var max = list[0].c || 1;
    el.innerHTML = list.map(function(it){
      var pct = Math.round((it.c / max) * 100);
      var k = String(it.k).replace(/[<>&]/g, '');
      return '<div class="rl"><div class="k" title="'+k+'">'+k+'</div><div class="c">'+fmt(it.c)+'</div>'+
             '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';
    }).join('');
  }

  function chips(id, obj, empty){
    var el = $(id);
    var keys = obj ? Object.keys(obj) : [];
    if(!keys.length){ el.innerHTML = '<div class="muted">'+empty+'</div>'; return; }
    keys.sort(function(a,b){ return obj[b]-obj[a]; });
    el.innerHTML = keys.map(function(k){
      var kk = String(k).replace(/[<>&]/g,'');
      return '<div class="chip">'+kk+' <b>'+fmt(obj[k])+'</b></div>';
    }).join('');
  }

  // période
  Array.prototype.forEach.call(document.querySelectorAll('.seg [data-d]'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.seg [data-d]'), function(x){ x.classList.remove('on'); });
      b.classList.add('on'); days = parseInt(b.getAttribute('data-d'),10) || 30; load();
    });
  });

  // login
  $('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = $('loginBtn'); $('loginNote').textContent = ''; btn.disabled = true; btn.textContent = 'Connexion…';
    try{
      var res = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
      if(res.error){ $('loginNote').textContent = 'Identifiants incorrects.'; }
      else { await load(); }
    }catch(err){ $('loginNote').textContent = 'Erreur de connexion.'; }
    btn.disabled = false; btn.textContent = 'Se connecter';
  });

  $('logout').addEventListener('click', async function(){ try{ await sb.auth.signOut(); }catch(e){} showLogin('Déconnecté.'); });

  load();
})();
</script>
</body>
</html>
